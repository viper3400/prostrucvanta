{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl mb-4">Benutzerverwaltung</h1>
<table class="w-full bg-white rounded shadow overflow-hidden">
<thead class="bg-slate-200"><tr><th class="p-2 text-left">E-Mail</th><th class="p-2">Name</th><th class="p-2">Project Access</th><th class="p-2">Global Admin</th></tr></thead>
<tbody>
{% for u in users %}
<tr class="border-t">
<td class="p-2">{{u.email}}</td>
<td class="p-2">{{u.name}}</td>
<td class="p-2 text-center">
<form method="post" action="{{ request.scope.root_path }}/admin/users/{{u.id}}/project-access">
<input type="hidden" name="enabled" value="1">
<button class="text-xs">{{ 'Entfernen' if 'Project Access' in u.permissions else 'Gewähren' }}</button>
</form>
</td>
<td class="p-2 text-center">
<form method="post" action="{{ request.scope.root_path }}/admin/users/{{u.id}}/global-administration">
<input type="hidden" name="enabled" value="1">
<button class="text-xs">{{ 'Entfernen' if 'Global Administration' in u.permissions else 'Gewähren' }}</button>
</form>
</td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
