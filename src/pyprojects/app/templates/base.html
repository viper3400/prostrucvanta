<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyProjects</title>
<script src="https://cdn.tailwindcss.com"></script>
<meta name="csrf-token" content="">
</head>
<body class="bg-slate-50 text-slate-900">
<nav class="bg-white border-b">
<div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
<a href="{{ request.scope.root_path }}/" class="font-bold">PyProjects</a>
<div class="space-x-4">
<a href="{{ request.scope.root_path }}/projects" class="hover:underline">Projekte</a>
<a href="{{ request.scope.root_path }}/kanban" class="hover:underline">Kanban</a>
<a href="{{ request.scope.root_path }}/tasks" class="hover:underline">Tasks</a>
{% if current_user %}
<a href="{{ request.scope.root_path }}/admin" class="hover:underline">Administration</a>
<form action="{{ request.scope.root_path }}/logout" method="post" class="inline" id="logout-form"><input type="hidden" name="csrf_token" value=""><button class="hover:underline">Logout</button></form>
{% else %}
<a href="{{ request.scope.root_path }}/login" class="hover:underline">Login</a>
{% endif %}
</div>
</div>
</nav>
<main class="max-w-6xl mx-auto p-4">{% block content %}{% endblock %}</main>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const token = document.cookie.split('; ').find(row => row.startsWith('csrf_token='))?.split('=')[1] || '';
  document.querySelectorAll('form').forEach(f => {
    if (!f.querySelector('input[name="csrf_token"]')) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'csrf_token';
      input.value = token;
      f.appendChild(input);
    } else {
      f.querySelector('input[name="csrf_token"]').value = token;
    }
  });
});
</script>
</body>
</html>
