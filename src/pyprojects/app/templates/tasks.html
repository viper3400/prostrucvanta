{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl mb-4">Tasks</h1>
<form method="post" action="{{ request.scope.root_path }}/tasks" class="bg-white p-4 rounded shadow mb-4 grid grid-cols-3 gap-2">
<input name="title" placeholder="Titel" required class="border p-2">
<select name="project_id" required class="border p-2">
<option value="" disabled selected>Projekt auswählen</option>
{% for project in projects %}<option value="{{project.id}}">{{project.name}}</option>{% endfor %}
</select>
<select name="status" class="border p-2"><option>Backlog</option><option>Offen</option><option>In Bearbeitung</option><option>Blockiert</option><option>Erledigt</option></select>
<select name="priority" class="border p-2"><option>Niedrig</option><option>Normal</option><option>Hoch</option><option>Kritisch</option></select>
<button class="bg-blue-600 text-white px-3 py-2 rounded">Erstellen</button>
</form>
<table class="w-full bg-white rounded shadow overflow-hidden">
<thead class="bg-slate-200"><tr><th class="p-2 text-left">Titel</th><th class="p-2">Projekt</th><th class="p-2">Unterprojekt</th><th class="p-2">Status</th><th class="p-2">Priorität</th><th class="p-2">Zugewiesen</th><th class="p-2">Aktionen</th></tr></thead>
<tbody>
{% for t in tasks %}
<tr class="border-t">
<td class="p-2">{{t.title}}</td>
<td class="p-2">{{t.project_name}}</td>
<td class="p-2">{{t.subproject_name or ''}}</td>
<td class="p-2">{{t.status}}</td>
<td class="p-2">{{t.priority}}</td>
<td class="p-2">{{t.assignee_name or ''}}</td>
<td class="p-2">
<form method="post" action="{{ request.scope.root_path }}/tasks/{{t.id}}/duplicate" class="inline"><button class="text-xs">Duplizieren</button></form>
<form method="post" action="{{ request.scope.root_path }}/tasks/{{t.id}}/delete" class="inline"><button class="text-xs text-red-600">Löschen</button></form>
</td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
