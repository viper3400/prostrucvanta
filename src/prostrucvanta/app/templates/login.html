{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow">
<h1 class="text-xl mb-4">{{ translate('Anmelden', locale_for(request)) }}</h1>
{% if google_configured %}
<a href="{{ request.scope.root_path }}/auth/google" class="inline-block bg-blue-600 text-white px-4 py-2 rounded">{{ translate('Anmelden mit Google', locale_for(request)) }}</a>
{% else %}
<p>{{ translate('Google OAuth nicht konfiguriert.', locale_for(request)) }}</p>
{% endif %}
</div>
{% endblock %}
