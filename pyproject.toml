[project]
name = "prostrucvanta"
version = "0.1.0"
description = "Lightweight project and task management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "authlib>=1.3,<2",
  "jinja2>=3.1,<4",
  "httpx2>=2.0,<3",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "itsdangerous>=2.2,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project.entry-points."tool_host.plugins"]
prostrucvanta = "app.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/prostrucvanta/app"]

[tool.uv.workspace]
members = []

[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.27"]
